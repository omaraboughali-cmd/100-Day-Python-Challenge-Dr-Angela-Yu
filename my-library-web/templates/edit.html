<!DOCTYPE html>

<html lang="en">

<head>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <meta charset="UTF-8">

    <title>Edit Rating</title>

</head>

<body>
    
    <form action="{{ url_for('edit') }}" method="POST">
        <!-- Hidden input to keep track of which book ID we are editing -->
        <input type="hidden" name="id" value="{{ book.id }}">
        
        <p>Book Name: <strong>{{ book.title }}</strong></p>
        
        <p>Current Rating: {{ book.rating }}</p>
        
        <P>New Rating:</P>

        <br>
        
        <input type="number" step="0.1" name="rating" value="" autofocus required>
        
        {% if error %}

            <p>{{ error }}</p>

        {% endif %}
        
        <button type="submit">Change Rating</button>
    
    </form>

</body>

</html>
