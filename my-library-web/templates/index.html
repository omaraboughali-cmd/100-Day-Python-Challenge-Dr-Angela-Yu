<!DOCTYPE html>
<html lang="en">
  <head>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <meta charset="UTF-8" />
    
    <title>Library</title>
  
  </head>
  
  <body>
  
    <h1>My Library</h1>
  
    <ul>
      {% for book in books %}
        <a href="{{ url_for('delete', id=book.id) }}">Delete</a>
        <li>{{book.title}} - {{book.author}} - {{book.rating}}/10
        <a href="{{ url_for('edit', id=book.id) }}">Edit Rating</a>
        
        </li>
      {% else %}
        <li>Library is empty</li>

      {% endfor %}
    </ul>

    <a href="{{url_for('add')}}">Add New Book</a>
  </body>
</html>
