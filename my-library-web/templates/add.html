<!DOCTYPE html>

<html lang="en">

<head>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <meta charset="UTF-8">

    <title>Add New Book</title>

</head>

<body>


    <h1>Add a New Book</h1>


    {% if error %}

        <p>{{ error }}</p>

    {% endif %}


    <form action="{{ url_for('add') }}" method="POST">

        <p>

            <input type="text" name="title" placeholder="Book Title" autofocus required>
        </p>


        <p>

            <input type="text" name="author" placeholder="Book Author" required>

        </p>


        <p>

            <input type="number" step="0.1" name="rating" placeholder="Rating (e.g. 8.5)" required>

        </p>


        <p>

            <button type="submit">Add Book</button>

        </p>

    </form>


    <p>

        <a href="{{ url_for('home') }}">Back to Home</a>

    </p>


</body>

</html>
